<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>หุ่นยนต์ส่งของเมืองโคราช</title>
<meta name="description" content="เกมฝึกเขียนอัลกอริทึมด้วยบล็อกคำสั่ง พาหุ่นยนต์ส่งของรอบเมืองโคราช วิทยาการคำนวณ ม.1">
<meta name="theme-color" content="#FBF7EF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2A44; --ink2:#5b6478; --paper:#FBF7EF; --card:#ffffff; --line:#EAE2D2; --accent:#A84F12; --accent2:#C8661E;
  --f:#8CCB9B; --r:#8EC3EA; --l:#F4D35E; --rep:#F2A65A; --bad:#C62828; --ok:#2E7D32;
  --shadow:0 1px 2px rgba(30,42,68,.06),0 8px 24px rgba(30,42,68,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif}
body{min-height:100vh;background:
  radial-gradient(1200px 600px at 80% -10%,#FCE7CF 0,transparent 60%),
  radial-gradient(900px 500px at -10% 20%,#E3F0E6 0,transparent 55%),var(--paper)}
button{font-family:'Kanit',sans-serif;color:var(--ink);cursor:pointer}
.app{max-width:1240px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 28px}

/* header */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo .mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#F2A65A,#A84F12);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(168,79,18,.3)}
.logo h1{font-family:'Kanit';font-weight:600;font-size:21px;margin:0;line-height:1.1}
.logo small{display:block;font-family:'Sarabun';font-weight:400;font-size:13px;color:var(--ink2)}
.tools{display:flex;gap:8px}
.icbtn{height:42px;min-width:42px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:15px;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.icbtn.ar{background:var(--ink);color:#fff;border-color:var(--ink)}
.icbtn:focus-visible,.mcard:focus-visible,.blk:focus-visible,.tbtn:focus-visible{outline:3px solid #E8B400;outline-offset:2px}

/* missions */
.missions{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.missions::-webkit-scrollbar{display:none}
.mcard{flex:0 0 auto;min-width:150px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.mcard:hover{transform:translateY(-2px)}
.mcard .k{font-family:'Kanit';font-size:12px;color:var(--ink2);letter-spacing:.02em}
.mcard .t{font-family:'Kanit';font-weight:500;font-size:16px;display:block;margin:1px 0 2px}
.mcard .s{font-size:14px;letter-spacing:1px;color:#d8cfbd}
.mcard .s b{color:#E8A400;font-weight:400}
.mcard.on{border:2px solid var(--accent);background:linear-gradient(180deg,#fff,#FFF6EC)}

/* layout */
.main{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:960px){.main{grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);align-items:start}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}

/* scene */
.scene{position:relative;overflow:hidden;padding:0;background:linear-gradient(180deg,#CFE8F6 0%,#E8F3F6 55%,#F6EFE0 100%)}
.brief{position:relative;margin:12px 12px 0;z-index:2;background:rgba(255,255,255,.9);border-radius:14px;padding:9px 13px;box-shadow:0 4px 14px rgba(30,42,68,.1);font-size:15px;line-height:1.45}
.brief b{font-family:'Kanit';font-weight:600;font-size:16px}
#world{display:block;width:100%;height:auto}
.cloud{animation:drift 60s linear infinite}
.cloud.c2{animation-duration:85s;animation-delay:-30s}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(820px)}}
.isle{animation:bob 7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.goalpin{animation:pin 1.6s ease-in-out infinite}
@keyframes pin{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.goalring{animation:ring 1.4s ease-in-out infinite alternate}
@keyframes ring{from{stroke-opacity:.35}to{stroke-opacity:1}}
.goaltop{animation:glow 1.8s ease-in-out infinite alternate}
@keyframes glow{from{fill:#FFE68A}to{fill:#FFD23F}}
.hud{position:absolute;right:12px;bottom:12px;z-index:2;display:flex;gap:6px}
.chip{background:rgba(255,255,255,.9);border-radius:999px;padding:5px 11px;font-family:'Kanit';font-size:13px;box-shadow:0 2px 8px rgba(30,42,68,.12)}
@media (prefers-reduced-motion: reduce){.cloud,.isle,.goalpin,.goaltop,.goalring{animation:none}}

/* program side */
.side{padding:16px}
.h{font-family:'Kanit';font-weight:500;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 8px}
.h small{font-family:'Sarabun';font-weight:400;color:var(--ink2);font-size:13px}
.prog{min-height:92px;border-radius:16px;padding:12px 10px;background:repeating-linear-gradient(90deg,#FBF7EF 0 22px,#F7F1E4 22px 23px);border:2px dashed #D8CDB6;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.prog .empty{color:#9aa1b1;font-size:15px;padding:0 6px}
.blk{position:relative;width:58px;height:58px;border-radius:15px;border:none;display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 -5px 0 rgba(30,42,68,.16),0 3px 8px rgba(30,42,68,.12);transition:transform .15s,box-shadow .15s}
.blk svg{width:30px;height:30px}
.blk.f{background:linear-gradient(180deg,#9FD7AE,#7FBF8F)}
.blk.r{background:linear-gradient(180deg,#A6D1F0,#7DB5DF)}
.blk.l{background:linear-gradient(180deg,#F8DE7C,#EDC746)}
.blk .n{position:absolute;top:-8px;left:-6px;background:var(--ink);color:#fff;border-radius:999px;font-family:'Kanit';font-size:11px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.blk.now{transform:translateY(-6px) scale(1.06);box-shadow:inset 0 -5px 0 rgba(30,42,68,.16),0 0 0 3px var(--ink),0 10px 18px rgba(30,42,68,.25)}
.blk.bad{box-shadow:inset 0 -5px 0 rgba(30,42,68,.16),0 0 0 3px var(--bad);animation:bad .5s ease-in-out 2}
.blk.done{opacity:.55}
@keyframes bad{50%{transform:scale(1.12)}}
.rep{position:relative;display:inline-flex;align-items:center;gap:6px;border:2px solid #E7A060;border-radius:17px;padding:4px 5px 4px 4px;background:linear-gradient(180deg,#FFF1E2,#FFE6CC)}
.rep .rl{font-family:'Kanit';font-size:14px;background:linear-gradient(180deg,#F6B575,#EE9A4B);border:none;border-radius:12px;height:50px;padding:0 10px;white-space:nowrap;box-shadow:inset 0 -4px 0 rgba(30,42,68,.14)}
.rep .hole{width:58px;height:58px;border-radius:15px;border:2px dashed #E0A56B;display:flex;align-items:center;justify-content:center;font-size:12px;color:#b5651d;text-align:center;line-height:1.1}
.rep>.n{position:absolute;top:-8px;left:-6px;background:var(--ink);color:#fff;border-radius:999px;font-family:'Kanit';font-size:11px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.rep.now{box-shadow:0 0 0 3px var(--ink)}
.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tbtn{border:none;border-radius:16px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px;box-shadow:inset 0 -5px 0 rgba(30,42,68,.16),0 3px 8px rgba(30,42,68,.12);transition:transform .1s}
.tbtn:active{transform:translateY(2px)}
.tbtn svg{width:32px;height:32px}
.tbtn.f{background:linear-gradient(180deg,#9FD7AE,#7FBF8F)}.tbtn.r{background:linear-gradient(180deg,#A6D1F0,#7DB5DF)}.tbtn.l{background:linear-gradient(180deg,#F8DE7C,#EDC746)}.tbtn.rp{background:linear-gradient(180deg,#F6B575,#EE9A4B)}
.ctrl{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-top:12px}
.run{border:none;border-radius:16px;background:linear-gradient(180deg,#C8661E,#A84F12);color:#fff;font-size:19px;font-weight:600;padding:14px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 6px 14px rgba(168,79,18,.3)}
.sec{border-radius:16px;border:1px solid var(--line);background:#fff;font-size:16px;padding:0 16px;box-shadow:var(--shadow)}
button:disabled{opacity:.45;cursor:default}
.msg{margin-top:14px;border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.5;background:#F7F3EA;min-height:52px;transition:background .2s}
.msg.ok{background:#E8F5E9}.msg.err{background:#FDECEA}
.msg b{font-family:'Kanit';font-weight:600}
.stars{font-size:24px;letter-spacing:3px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:#8a90a0}
.link{background:none;border:none;color:#8a90a0;text-decoration:underline;font-size:13px;padding:4px;font-family:inherit}
.speed{display:flex;gap:4px}
.speed button{border:1px solid var(--line);background:#fff;border-radius:10px;font-size:13px;padding:4px 9px}
.speed button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="mark"><svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><rect x="14" y="20" width="36" height="30" rx="8" fill="#fff"/><rect x="20" y="27" width="24" height="12" rx="5" fill="#1E2A44"/><circle cx="27" cy="33" r="2.6" fill="#8CCB9B"/><circle cx="37" cy="33" r="2.6" fill="#8CCB9B"/><path d="M32 20 V10" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="9" r="4.5" fill="#F4D35E"/></svg></div>
      <h1>หุ่นยนต์ส่งของเมืองโคราช<small>เรียงบล็อกคำสั่ง · วิทยาการคำนวณ ม.1 (ว 4.2 ม.1/1)</small></h1>
    </div>
    <div class="tools">
      <button class="icbtn" id="snd" aria-label="เปิด/ปิดเสียง">🔊</button>
      <a class="icbtn ar" href="/ar/" style="text-decoration:none">📷 โหมด AR</a>
    </div>
  </header>

  <nav class="missions" id="missions" aria-label="เลือกภารกิจ"></nav>

  <div class="main">
    <section class="panel scene" aria-label="แผนที่เมืองโคราช">
      <div class="brief" id="brief"></div>
      <svg id="world" viewBox="0 30 640 470" role="img" aria-label="แผนที่สามมิติ 5 คูณ 5 ช่องของเมืองโคราช พร้อมหุ่นยนต์"></svg>
      <div class="hud"><span class="chip" id="where">A5 · หันทิศเหนือ</span></div>
    </section>

    <section class="panel side" aria-label="เขียนโปรแกรม">
      <div class="h">โปรแกรมของฉัน <small id="count">0 ก้อน</small></div>
      <div class="prog" id="prog"></div>

      <div class="h" style="margin-top:14px">บล็อกคำสั่ง <small>แตะบล็อกในโปรแกรมเพื่อเปลี่ยนชนิด</small></div>
      <div class="palette">
        <button class="tbtn f" data-add="f"><svg viewBox="0 0 24 24"><path d="M12 20 V5 M6 11 L12 5 L18 11" fill="none" stroke="#1E2A44" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>เดินหน้า</button>
        <button class="tbtn r" data-add="r"><svg viewBox="0 0 24 24"><path d="M7 20 V11 Q7 7 11 7 H19 M15 3 L19 7 L15 11" fill="none" stroke="#1E2A44" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>หันขวา</button>
        <button class="tbtn l" data-add="l"><svg viewBox="0 0 24 24"><path d="M17 20 V11 Q17 7 13 7 H5 M9 3 L5 7 L9 11" fill="none" stroke="#1E2A44" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>หันซ้าย</button>
        <button class="tbtn rp" data-add="rep"><span style="font-size:24px;line-height:32px;height:32px">🔁</span>ทำซ้ำ</button>
      </div>
      <div class="ctrl">
        <button class="run" id="run">▶ ให้หุ่นยนต์ทำงาน</button>
        <button class="sec" id="undo" aria-label="ลบบล็อกสุดท้าย">⌫</button>
        <button class="sec" id="clear">ล้าง</button>
      </div>
      <div class="msg" id="msg" aria-live="polite"></div>
      <div class="foot">
        <div class="speed" role="group" aria-label="ความเร็ว"><button data-sp="1" class="on">ปกติ</button><button data-sp="0.55">เร็ว</button></div>
        <button class="link" id="answer">ครู: แสดงเฉลย</button>
      </div>
    </section>
  </div>
</div>
<canvas class="confetti" id="confetti"></canvas>

const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  if(f>=1){r+=(255-r)*(f-1);g+=(255-g)*(f-1);b+=(255-b)*(f-1);}else{r*=f;g*=f;b*=f;}

// iso box centred on (x,y) ground point; s = footprint scale (1 = one tile); h = height; z = lift
function isoBox(g,x,y,s,h,z,color,cls){

  el('polygon',{points:pts([B,Rr,Rb,Bb]),fill:shade(color,.7)},g);
  const top=el('polygon',{points:pts([T,Rr,B,Lf]),fill:shade(color,1.12)},g);
  if(cls)top.setAttribute('class',cls);
  return{T,R:Rr,B,L:Lf,Rb,Bb,Lb};
}

let layerTiles,layerGoal,layerMarks,layerObj,layerTags;
function drawStatic(){

/* robot drawing: heading 0 N(up-right) 1 E(down-right) 2 S(down-left) 3 W(up-left) */
function drawRobot(g,x,y,h,squash,hop){
  const s=1.12;
  const k=el('g',{transform:'translate('+x+','+(y-hop)+') scale('+squash+',1) translate('+(-x)+','+(-y)+')'},g);
  el('ellipse',{cx:x,cy:y+2+hop,rx:30,ry:13,fill:'rgba(30,42,68,.22)'},k);
  const BH=34*s,HH=26*s;const body=isoBox(k,x,y,.46*s,BH,0,'#E4ECF6');
  const head=isoBox(k,x,y,.36*s,HH,BH+4,'#F2A65A');
  // which visible face looks where the robot faces: E -> right face (B..R), S -> left face (L..B)
  const face=(G,t,u)=>{ // point on right face param t, height frac u
    return [G.B[0]+(G.R[0]-G.B[0])*t, (G.B[1]+(G.R[1]-G.B[1])*t)*(1-u)+(G.Bb[1]+(G.Rb[1]-G.Bb[1])*t)*u];};
  const faceL=(G,t,u)=>[G.L[0]+(G.B[0]-G.L[0])*t,(G.L[1]+(G.B[1]-G.L[1])*t)*(1-u)+(G.Lb[1]+(G.Bb[1]-G.Lb[1])*t)*u];
  const hb=Object.assign({},head);hb.Rb=[head.R[0],head.R[1]+HH];hb.Bb=[head.B[0],head.B[1]+HH];hb.Lb=[head.L[0],head.L[1]+HH];
  if(h===1||h===2){
    const f=h===1?face:faceL;
    [.3,.7].forEach(t=>{const p=f(hb,t,.45);el('ellipse',{cx:p[0],cy:p[1],rx:3.4,ry:5,fill:'#1E2A44'},k);el('circle',{cx:p[0]+1,cy:p[1]-2,r:1.2,fill:'#fff'},k);});
    const bb=Object.assign({},body);bb.Rb=[body.R[0],body.R[1]+BH];bb.Bb=[body.B[0],body.B[1]+BH];bb.Lb=[body.L[0],body.L[1]+BH];
    const p=f(bb,.5,.45);el('circle',{cx:p[0],cy:p[1],r:5.5,fill:'#8CCB9B',stroke:'#fff','stroke-width':1.5},k);
  }else{
    // back view: delivery box on the visible back face
    const f=h===0?faceL:face;
    const bb=Object.assign({},body);bb.Rb=[body.R[0],body.R[1]+BH];bb.Bb=[body.B[0],body.B[1]+BH];bb.Lb=[body.L[0],body.L[1]+BH];
    const a=f(bb,.2,.2),b=f(bb,.8,.2),c=f(bb,.8,.85),d=f(bb,.2,.85);

    el('line',{x1:(a[0]+b[0])/2,y1:(a[1]+b[1])/2,x2:(c[0]+d[0])/2,y2:(c[1]+d[1])/2,stroke:'#A87542','stroke-width':1.5},k);
  }

}

  const v=[[TW/2,-TH/2],[TW/2,TH/2],[-TW/2,TH/2],[-TW/2,-TH/2]][h];
  const len=.36, px=v[0]*len, py=v[1]*len, nx=-v[1]*.12, ny=v[0]*.12*.5;
  el('polygon',{points:pts([[x+px,y+py],[x+px*.45+nx,y+py*.45+ny*2],[x+px*.45-nx,y+py*.45-ny*2]]),fill:'#A84F12',opacity:.9},g);
}
/* dynamic layer: landmarks + robot in depth order */
let anim={x:0,y:0,h:0,squash:1,hop:0,depth:0};
function drawObjects(){
  layerObj.innerHTML='';
  const m=MISSIONS[mi];
  const robotTile=pos.x+','+pos.y;
  const items=[];
  for(const key in PLACES){const [c,r]=key.split(',').map(Number);if(m.block.some(b=>b[0]===c&&b[1]===r))continue;items.push({d:c+r,c,r,ic:PLACES[key].ic});}
  m.block.forEach(([c,r])=>items.push({d:c+r,c,r,ic:'barrier'}));
  items.push({d:anim.depth,robot:true});
  items.sort((a,b)=>a.d-b.d);
  const K=(TW/2)/92;
  for(const it of items){
    if(it.robot){
      const g=el('g',{},layerObj);
      headingArrow(g,anim.x,anim.y,anim.h);
      drawRobot(g,anim.x,anim.y,anim.h,anim.squash,anim.hop);
      continue;
    }
    const x=cx(it.c,it.r),y=cy(it.c,it.r)-SLAB+2;
    const here=Math.round(anim.depth)===it.d&&(it.c+','+it.r)===nearTile();
    el('use',{href:'#ic-'+it.ic,x:x-100*K,y:y-118*K,width:200*K,height:190*K,opacity:here?.35:1},layerObj);
  }
}
function nearTile(){return Math.round(animTile.x)+','+Math.round(animTile.y);}
let animTile={x:0,y:4};
function drawTags(){
  layerTags.querySelectorAll('.tag').forEach(t=>t.remove());
  const m=MISSIONS[mi];
  for(const key in PLACES){
    const [c,r]=key.split(',').map(Number);
    if(m.block.some(b=>b[0]===c&&b[1]===r))continue;
    const TOP={mountain:84,prang:92,plinth:76,gate:58,jar:50,silk:42,noodles:48};
    const isGoal=m.goal&&m.goal[0]===c&&m.goal[1]===r;
    const x=cx(c,r),y=cy(c,r)-SLAB+TH*.3;
    const g=el('g',{class:'tag'},layerTags);
    const t=el('text',{x:x,y:y+10,'text-anchor':'middle','font-family':'Kanit','font-size':12.5,'font-weight':500,fill:'#1E2A44'},g);
    t.textContent=PLACES[key].nm;
    const w=PLACES[key].nm.length*7+12;
    const rc=el('rect',{x:x-w/2,y:y-4,width:w,height:19,rx:9.5,fill:'rgba(255,255,255,.92)',stroke:'rgba(30,42,68,.12)'},g);
    g.insertBefore(rc,t);
  }
  const pinEl=layerTags.querySelector('.goalpin');if(pinEl)layerTags.appendChild(pinEl);
  m.block.forEach(([c,r])=>{const x=cx(c,r),y=cy(c,r)-SLAB+TH*.3;const g=el('g',{class:'tag'},layerTags);el('rect',{x:x-30,y:y-3,width:60,height:18,rx:9,fill:'rgba(198,40,40,.9)'},g);const t=el('text',{x:x,y:y+10,'text-anchor':'middle','font-family':'Kanit','font-size':12,fill:'#fff'},g);t.textContent='ถนนปิด';});
}

/* ---------- state ---------- */
let mi=0, prog=[], running=false, pos={...START}, trail=[], speed=1;
const clone=a=>JSON.parse(JSON.stringify(a));
const progEl=$('prog'), msg=$('msg');
function setAnimToPos(){anim.x=cx(pos.x,pos.y);anim.y=cy(pos.x,pos.y)-SLAB;anim.h=pos.h;anim.squash=1;anim.hop=0;anim.depth=pos.x+pos.y+.5;animTile={x:pos.x,y:pos.y};}
function resetBot(){pos={...START};trail=[];setAnimToPos();drawTrail();drawObjects();updWhere();}
function updWhere(){$('where').textContent=COLS[pos.x]+(pos.y+1)+' · หันทิศ'+DIR[pos.h];}

/* tween helper */
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function tween(ms,fn){return new Promise(res=>{const t0=performance.now();const f=now=>{const t=Math.min(1,(now-t0)/ms);fn(t);drawObjects();if(t<1)requestAnimationFrame(f);else res();};requestAnimationFrame(f);});}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- program UI ---------- */
function chip(it,label,path){
  const d=document.createElement('button');
  d.className='blk '+it.t;
  d.innerHTML='<svg viewBox="0 0 24 24"><g fill="none" stroke="#1E2A44" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">'+ARROW[it.t]+'</g></svg>'+(label?'<span class="n">'+label+'</span>':'');
  d.setAttribute('aria-label',NAME[it.t]+' แตะเพื่อเปลี่ยน');
  d.dataset.path=path;
  d.onclick=()=>{if(running)return;it.t={f:'r',r:'l',l:'f'}[it.t];sfx.add();edited();};
  return d;
}
function countCards(){let c=0;prog.forEach(it=>{c+=it.t==='rep'?(it.body?2:1):1;});return c;}
function render(){
  progEl.innerHTML='';
  if(!prog.length)progEl.innerHTML='<span class="empty">แตะบล็อกคำสั่งด้านล่างเพื่อเริ่มเขียนโปรแกรม</span>';
  prog.forEach((it,i)=>{
    if(it.t==='rep'){
      const g=document.createElement('div');g.className='rep';g.dataset.path=String(i);
      const lb=document.createElement('button');lb.className='rl';lb.textContent='🔁 ทำซ้ำ '+it.n+' ครั้ง';
      lb.setAttribute('aria-label','ทำซ้ำ '+it.n+' ครั้ง แตะเพื่อเปลี่ยนจำนวน');
      lb.onclick=()=>{if(running)return;it.n=it.n>=5?2:it.n+1;sfx.add();edited();};
      g.appendChild(lb);
      if(it.body)g.appendChild(chip(it.body,'',i+'.0'));
      else{const h=document.createElement('div');h.className='hole';h.textContent='ใส่บล็อก';g.appendChild(h);}
      const n=document.createElement('span');n.className='n';n.textContent=String(i+1);g.appendChild(n);
      progEl.appendChild(g);
    }else progEl.appendChild(chip(it,String(i+1),String(i)));
  });
  const m=MISSIONS[mi];
  $('count').textContent=countCards()+' ก้อน'+(m.limit?' (ไม่เกิน '+m.limit+')':'');
}
function edited(){render();resetBot();setMsg('');}
function setMsg(h,k){msg.className='msg'+(k?' '+k:'');msg.innerHTML=h||defaultMsg();}
function defaultMsg(){return MISSIONS[mi].goal?'หุ่นยนต์อยู่ที่ <b>A5</b> หันไปทิศ<b>เหนือ</b> (ลูกศรสีส้มใต้หุ่นยนต์บอกทิศที่หันอยู่)':'เขียนโปรแกรมอะไรก็ได้ แล้วกด ▶';}
function add(t){
  if(running)return;
  const last=prog[prog.length-1];
  if(t==='rep'){
    if(last&&last.t==='rep'&&!last.body){setMsg('ใส่บล็อกลงในช่อง <b>ทำซ้ำ</b> ก่อนนะ','err');return;}
    prog.push({t:'rep',n:2,body:null});
  }else if(last&&last.t==='rep'&&!last.body)last.body={t};
  else prog.push({t});
  sfx.add();edited();
}

/* ---------- missions ---------- */
function renderMissions(){
  const nav=$('missions');nav.innerHTML='';
  MISSIONS.forEach((m,i)=>{
    const b=document.createElement('button');b.className='mcard'+(i===mi?' on':'');
    const st=m.goal?'<span class="s">'+'<b>★</b>'.repeat(stars[i])+'★'.repeat(3-stars[i])+'</span>':'<span class="s" style="color:#8a90a0;letter-spacing:0">สร้างโจทย์เอง</span>';
    b.innerHTML='<span class="k">'+m.tab.toUpperCase()+'</span><span class="t">'+m.title+'</span>'+st;
    b.onclick=()=>loadMission(i);nav.appendChild(b);
  });
}
function loadMission(i){
  if(running)return;
  mi=i;const m=MISSIONS[i];
  renderMissions();
  $('brief').innerHTML='<b>'+m.title+'</b> · '+m.text;
  prog=m.preset?clone(m.preset):[];
  $('answer').style.display=m.answer?'':'none';
  drawStatic();drawTags();render();resetBot();setMsg('');
}

/* ---------- run ---------- */
function mark(path){
  progEl.querySelectorAll('.now').forEach(e=>e.classList.remove('now'));
  if(path==null)return;
  const e=progEl.querySelector('[data-path="'+path+'"]');if(e)e.classList.add('now');
  if(path.includes('.')){const g=progEl.querySelector('.rep[data-path="'+path.split('.')[0]+'"]');if(g)g.classList.add('now');}
}
const cell=(x,y)=>COLS[x]+(y+1);
const placeName=(x,y)=>{const p=PLACES[x+','+y];return cell(x,y)+(p?' ('+p.nm+')':'');};
async function step(it,path,num){
  mark(path);
  const T=480*speed;
  if(it.t==='r'||it.t==='l'){
    sfx.turn();
    const nh=it.t==='r'?(pos.h+1)%4:(pos.h+3)%4;
    await tween(T,t=>{anim.squash=Math.max(.15,Math.abs(Math.cos(t*Math.PI)));if(t>=.5)anim.h=nh;});
    pos.h=nh;anim.squash=1;updWhere();await sleep(90*speed);return true;
  }
  const nx=pos.x+DX[pos.h],ny=pos.y+DY[pos.h];
  const out=nx<0||ny<0||nx>4||ny>4;
  const blk=!out&&MISSIONS[mi].block.some(b=>b[0]===nx&&b[1]===ny);
  const x0=anim.x,y0=anim.y;
  if(out||blk){
    sfx.bump();
    const x1=cx(nx,ny),y1=cy(nx,ny)-SLAB;
    await tween(T*.9,t=>{const k=Math.sin(t*Math.PI)*.32;anim.x=x0+(x1-x0)*k;anim.y=y0+(y1-y0)*k;anim.hop=Math.sin(t*Math.PI*3)*3;});
    anim.x=x0;anim.y=y0;anim.hop=0;drawObjects();
    progEl.querySelectorAll('.now').forEach(e=>e.classList.remove('now'));
    const e=progEl.querySelector('[data-path="'+path+'"]');if(e)e.classList.add('bad');
    setMsg('💥 <b>บล็อกที่ '+num+' ('+NAME[it.t]+')</b> ทำให้หุ่นยนต์'+(out?'ออกนอกแผนที่':'ชนถนนปิด')+' ตอนนี้อยู่ที่ '+cell(pos.x,pos.y)+' หันไปทิศ'+DIR[pos.h]+' ลองไล่ดูบล็อกตั้งแต่ก้อนแรกว่าควรแก้ก้อนไหน','err');
    return false;
  }
  sfx.step();
  trail.push([pos.x,pos.y]);drawTrail();
  const x1=cx(nx,ny),y1=cy(nx,ny)-SLAB;
  anim.depth=Math.max(pos.x+pos.y,nx+ny)+.5;animTile={x:nx,y:ny};
  await tween(T,t=>{const e=ease(t);anim.x=x0+(x1-x0)*e;anim.y=y0+(y1-y0)*e;anim.hop=Math.sin(t*Math.PI)*9;});
  pos.x=nx;pos.y=ny;anim.hop=0;anim.depth=nx+ny+.5;drawObjects();updWhere();
  await sleep(70*speed);return true;
}
async function run(){
  if(running)return;
  if(!prog.length){setMsg('ยังไม่มีบล็อกเลย แตะบล็อกคำสั่งด้านล่างก่อนนะ','err');return;}
  if(prog.some(it=>it.t==='rep'&&!it.body)){setMsg('ช่อง <b>ทำซ้ำ</b> ยังว่างอยู่ ใส่บล็อกลงไปก่อนนะ','err');return;}
  progEl.querySelectorAll('.bad').forEach(e=>e.classList.remove('bad'));
  resetBot();await sleep(60);
  running=true;setBusy(true);setMsg('🤖 กำลังทำงานตามคำสั่ง…');
  let ok=true;
  for(let i=0;i<prog.length&&ok;i++){
    const it=prog[i];
    if(it.t==='rep'){
      const lb=progEl.querySelector('.rep[data-path="'+i+'"] .rl');
      for(let k=0;k<it.n&&ok;k++){if(lb)lb.textContent='🔁 รอบที่ '+(k+1)+'/'+it.n;ok=await step(it.body,i+'.0',(i+1)+' (ทำซ้ำรอบที่ '+(k+1)+')');}
      if(lb)lb.textContent='🔁 ทำซ้ำ '+it.n+' ครั้ง';
    }else ok=await step(it,String(i),i+1);
  }
  mark(null);running=false;setBusy(false);
  if(ok)finish();
}
function finish(){
  const m=MISSIONS[mi];
  if(!m.goal){setMsg('✅ หุ่นยนต์หยุดที่ <b>'+placeName(pos.x,pos.y)+'</b> หันไปทิศ'+DIR[pos.h],'ok');return;}
  if(pos.x===m.goal[0]&&pos.y===m.goal[1]){
    const n=countCards();
    let st=3;
    if(m.limit&&n>m.limit)st=2;
    stars[mi]=Math.max(stars[mi],st);store.set('kr-stars',stars);renderMissions();
    celebrate();
    if(st<3){setMsg('<div class="stars">⭐⭐<span style="opacity:.25">⭐</span></div>📦 ส่งของถึงแล้ว! แต่ใช้ '+n+' ก้อน เกิน '+m.limit+' ก้อน ลองใช้ 🔁 ทำซ้ำ แทนบล็อกเดินหน้าที่ซ้ำกันดูนะ','ok');return;}
    setMsg('<div class="stars">⭐⭐⭐</div>🎉 <b>ส่งของสำเร็จ!</b> ถึง '+placeName(m.goal[0],m.goal[1])+' ใช้บล็อก '+n+' ก้อน'+(mi<3?' · ไปภารกิจถัดไปได้เลย':''),'ok');
  }else{
    sfx.miss();
    setMsg('🤔 หุ่นยนต์หยุดที่ <b>'+placeName(pos.x,pos.y)+'</b> ยังไม่ถึง '+placeName(m.goal[0],m.goal[1])+' ลองไล่ดูบล็อกทีละก้อนว่าควรหันไปทางไหน','err');
  }
}
async function celebrate(){
  sfx.win();
  // happy hops
  for(let i=0;i<2;i++)await tween(380,t=>{anim.hop=Math.sin(t*Math.PI)*16;});
  anim.hop=0;drawObjects();
}
function setBusy(b){document.querySelectorAll('.tbtn,#run,#undo,#clear,.mcard,#answer').forEach(e=>e.disabled=b);}

/* ---------- confetti (canvas) ---------- */
const cv=$('confetti'),cx2=cv.getContext('2d');let parts=[];
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#8CCB9B','#8EC3EA','#F4D35E','#F2A65A','#A84F12'];
  const r=world.getBoundingClientRect();
  for(let i=0;i<120;i++)parts.push({x:r.left+r.width/2,y:r.top+r.height*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*11-3,s:4+Math.random()*5,c:cols[i%5],a:Math.random()*6,life:1});
  requestAnimationFrame(drawConfetti);
}
function drawConfetti(){
  cx2.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.a+=.15;p.life-=.012;cx2.save();cx2.globalAlpha=Math.max(0,p.life);cx2.translate(p.x,p.y);cx2.rotate(p.a);cx2.fillStyle=p.c;cx2.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);cx2.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+20);
  if(parts.length)requestAnimationFrame(drawConfetti);else cx2.clearRect(0,0,cv.width,cv.height);
}
const _cel=celebrate;celebrate=async function(){confetti();return _cel();};

/* ---------- wire up ---------- */
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));
$('run').onclick=run;
$('undo').onclick=()=>{if(running||!prog.length)return;const last=prog[prog.length-1];if(last.t==='rep'&&last.body)last.body=null;else prog.pop();edited();};
$('clear').onclick=()=>{if(running)return;prog=[];edited();};
$('answer').onclick=()=>{const m=MISSIONS[mi];if(!m.answer||running)return;prog=clone(m.answer);edited();setMsg('📖 นี่คือคำตอบตัวอย่าง กด ▶ เพื่อดูหุ่นยนต์ทำงาน');};
document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;document.querySelectorAll('.speed button').forEach(x=>x.classList.toggle('on',x===b));});
window.KR={state:()=>({prog:clone(prog),pos:{...pos},mi,running,stars:[...stars]})};
loadMission(0);
})();
</script>
